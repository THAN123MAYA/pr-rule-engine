<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rule Generator</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/iconfont/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0D1117;
      --surface-0: #010409;
      --surface-1: #161B22;
      --border:    #30363D;
      --border-strong: #484F58;
      --text-primary:   #E6EDF3;
      --text-secondary: #8B949E;
      --text-muted:     #484F58;
      --text-accent:    #3FB950;
      --text-success:   #3FB950;
      --text-danger:    #F85149;
      --bg-accent:  rgba(63,185,80,0.12);
      --bg-danger:  rgba(248,81,73,0.12);
      --fill-accent: #238636;
      --on-accent:   #ffffff;
      --border-accent: #3FB950;
      --border-danger: #F85149;
      --radius: 6px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface-1);
    }
    .header-icon {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: var(--bg-accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-icon i { font-size: 17px; color: var(--text-accent); }
    .header-title { font-size: 15px; font-weight: 600; }
    .header-sub { font-size: 12px; color: var(--text-secondary); margin-top: 1px; }

    /* Chat area */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Empty state */
    .empty {
      margin: auto;
      text-align: center;
      max-width: 520px;
    }
    .empty p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .suggestion {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-family: var(--font-sans);
      padding: 7px 13px;
      text-align: left;
      transition: all 0.15s;
    }
    .suggestion:hover {
      border-color: var(--border-accent);
      color: var(--text-accent);
      background: var(--bg-accent);
    }

    /* Messages */
    .msg-user {
      display: flex;
      justify-content: flex-end;
    }
    .msg-user-bubble {
      background: var(--fill-accent);
      color: var(--on-accent);
      border-radius: 12px 12px 0 12px;
      padding: 10px 14px;
      font-size: 14px;
      max-width: 80%;
      line-height: 1.5;
    }

    .msg-ai {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .ai-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--bg-accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .ai-avatar i { font-size: 15px; color: var(--text-accent); }
    .ai-content { max-width: 90%; min-width: 0; }

    .ai-header {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 0 12px 12px 12px;
      padding: 12px 14px;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .ai-header-top {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 6px;
    }
    .ai-header-top i { font-size: 14px; color: var(--text-success); }
    .rule-name { font-weight: 600; }
    .file-name {
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .explanation { color: var(--text-secondary); font-size: 13px; line-height: 1.5; }

    /* Code blocks */
    .code-block { margin-top: 10px; }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: var(--radius) var(--radius) 0 0;
      padding: 6px 12px;
    }
    .code-label {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex; align-items: center; gap: 6px;
    }
    .code-label i { font-size: 14px; }
    .copy-btn {
      background: none;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      font-family: var(--font-sans);
      padding: 3px 10px;
      display: flex; align-items: center; gap: 5px;
      transition: color 0.2s;
    }
    .copy-btn:hover { color: var(--text-primary); }
    .copy-btn.copied { color: var(--text-success); }
    pre {
      margin: 0;
      padding: 12px 14px;
      background: var(--surface-0);
      border: 1px solid var(--border);
      border-radius: 0 0 var(--radius) var(--radius);
      font-family: var(--font-mono);
      font-size: 12px;
      overflow-x: auto;
      color: var(--text-primary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .paste-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      padding-left: 2px;
    }
    .paste-hint code {
      font-family: var(--font-mono);
      background: var(--surface-0);
      padding: 1px 5px;
      border-radius: 4px;
      color: var(--text-secondary);
    }

    /* Error */
    .msg-error {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .error-bubble {
      background: var(--bg-danger);
      border: 1px solid var(--border-danger);
      border-radius: 0 12px 12px 12px;
      padding: 10px 14px;
      font-size: 14px;
      color: var(--text-danger);
      max-width: 85%;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .typing-dots {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: 0 12px 12px 12px;
      padding: 14px 18px;
      display: flex; align-items: center; gap: 5px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }

    /* Input area */
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--surface-1);
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      resize: none;
      font-family: var(--font-sans);
      font-size: 14px;
      padding: 10px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      background: var(--bg);
      color: var(--text-primary);
      line-height: 1.5;
      outline: none;
    }
    textarea::placeholder { color: var(--text-muted); }
    textarea:focus { border-color: var(--border-accent); }
    .send-btn {
      background: var(--fill-accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      padding: 0 16px;
      height: 42px;
      font-size: 14px;
      font-family: var(--font-sans);
      display: flex; align-items: center; gap: 6px;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .input-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      padding-left: 2px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon"><i class="ti ti-shield-check"></i></div>
    <div>
      <div class="header-title">Rule Generator</div>
      <div class="header-sub">Describe any rule in plain English</div>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="empty" id="empty">
      <p>Describe your PR rule in plain English and get a ready-to-use Python file — no coding needed.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="send(this.textContent)">PR title must start with feat, fix, docs, or chore</button>
        <button class="suggestion" onclick="send(this.textContent)">No file should have more than 300 lines</button>
        <button class="suggestion" onclick="send(this.textContent)">Every SQL file must start with an author comment</button>
        <button class="suggestion" onclick="send(this.textContent)">Branch name should only use lowercase letters and hyphens</button>
        <button class="suggestion" onclick="send(this.textContent)">No file should contain console.log or print() statements</button>
        <button class="suggestion" onclick="send(this.textContent)">PR author cannot merge into main directly</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea id="input" rows="2" placeholder="Describe your rule... (e.g. 'No Python file should be longer than 200 lines')" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" disabled>
        <i class="ti ti-arrow-up"></i> Generate
      </button>
    </div>
    <div class="input-hint">Press Enter to send · Shift+Enter for new line</div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const empty = document.getElementById("empty");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    input.addEventListener("input", () => {
      sendBtn.disabled = !input.value.trim();
    });

    function handleKey(e) {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (input.value.trim()) send();
      }
    }

    function scrollBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addUserMsg(text) {
      empty.style.display = "none";
      const div = document.createElement("div");
      div.className = "msg-user";
      div.innerHTML = `<div class="msg-user-bubble">${text}</div>`;
      chat.appendChild(div);
      scrollBottom();
    }

    function addTyping() {
      const div = document.createElement("div");
      div.className = "typing";
      div.id = "typing";
      div.innerHTML = `
        <div class="ai-avatar"><i class="ti ti-robot"></i></div>
        <div class="typing-dots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>`;
      chat.appendChild(div);
      scrollBottom();
      return div;
    }

    function removeTyping() {
      document.getElementById("typing")?.remove();
    }

    function copyText(btn, text) {
      navigator.clipboard.writeText(text);
      btn.classList.add("copied");
      btn.innerHTML = `<i class="ti ti-check"></i> Copied!`;
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.innerHTML = `<i class="ti ti-copy"></i> Copy`;
      }, 2000);
    }

    function addAIMsg(data) {
      const div = document.createElement("div");
      div.className = "msg-ai";

      const pyId = "py-" + Date.now();
      const cfgId = "cfg-" + Date.now();

      div.innerHTML = `
        <div class="ai-avatar"><i class="ti ti-robot"></i></div>
        <div class="ai-content">
          <div class="ai-header">
            <div class="ai-header-top">
              <i class="ti ti-check"></i>
              <span class="rule-name">${data.rule_name}</span>
              <span class="file-name">${data.filename}</span>
            </div>
            <div class="explanation">${data.explanation}</div>
          </div>

          <div class="code-block">
            <div class="code-header">
              <div class="code-label"><i class="ti ti-brand-python"></i>${data.filename}</div>
              <button class="copy-btn" onclick="copyText(this, document.getElementById('${pyId}').textContent)">
                <i class="ti ti-copy"></i> Copy
              </button>
            </div>
            <pre id="${pyId}">${escHtml(data.python_code)}</pre>
          </div>

          <div class="code-block">
            <div class="code-header">
              <div class="code-label"><i class="ti ti-file-code"></i>rules-config.yml entry</div>
              <button class="copy-btn" onclick="copyText(this, document.getElementById('${cfgId}').textContent)">
                <i class="ti ti-copy"></i> Copy
              </button>
            </div>
            <pre id="${cfgId}">${escHtml(data.config_entry)}</pre>
          </div>

          <p class="paste-hint">
            Copy <strong>${data.filename}</strong> → paste into your <code>rules/</code> folder,
            then add the config entry to <code>rules-config.yml</code>
          </p>
        </div>`;

      chat.appendChild(div);
      scrollBottom();
    }

    function addError(msg) {
      const div = document.createElement("div");
      div.className = "msg-error";
      div.innerHTML = `
        <div class="ai-avatar"><i class="ti ti-robot"></i></div>
        <div class="error-bubble">${msg}</div>`;
      chat.appendChild(div);
      scrollBottom();
    }

    function escHtml(str) {
      return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    async function send(text) {
      const rule = text || input.value.trim();
      if (!rule) return;

      input.value = "";
      sendBtn.disabled = true;

      addUserMsg(rule);
      const typing = addTyping();

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rule }),
        });
        const data = await res.json();
        removeTyping();
        if (data.error) {
          addError(data.error);
        } else {
          addAIMsg(data);
        }
      } catch (e) {
        removeTyping();
        addError("Something went wrong. Try describing the rule differently.");
      }
    }
  </script>
</body>
</html>
